# Strażnik — utwardzenie tunelu Cloudflare, audyt 26.09.2026.
# Na VPS: /etc/systemd/system/straznik-tunnel.service.d/hardening.conf
# Powrót: usunąć ten plik, `systemctl daemon-reload`, `systemctl restart straznik-tunnel`.
#
# cloudflared zostaje rootem, bo poświadczenie tunelu leży w /root/.cloudflared
# z prawami 400 root — ale bez żadnych uprawnień roota ponad czytanie własnych
# plików: pusty zestaw capabilities, system tylko do odczytu, bez nowych
# uprawnień. Właściciel czyta swój plik bez CAP_DAC_OVERRIDE.
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
# NIE `yes`: /root jest katalogiem domowym, a tam leży poświadczenie tunelu.
ProtectHome=read-only
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
CapabilityBoundingSet=
AmbientCapabilities=
# AF_NETLINK: cloudflared pyta jądro o interfejsy sieciowe przy wyborze adresu.
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
SystemCallArchitectures=native
