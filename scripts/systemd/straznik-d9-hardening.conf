# Strażnik — utwardzenie usługi (audyt D9, 14.09.2026).
# Na VPS: /etc/systemd/system/straznik.service.d/d9-hardening.conf
# Powrót: usunąć ten plik, `systemctl daemon-reload`, `systemctl restart straznik`
# (pliki w data/ należą wtedy do użytkownika straznik, root nadal ma do nich dostęp).
[Service]
# Osobny użytkownik systemowy zamiast roota.
User=straznik
Group=straznik
# „+” = jako root: skrypty z crona (kopie, migawki stref) i narzędzia uruchamiane
# ręcznie jako root mogą zostawić w data/ pliki roota — np. -wal/-shm SQLite,
# do których usługa nie mogłaby potem pisać.
ExecStartPre=+/bin/chown -R straznik:straznik /opt/straznik/backend/data
# Tylko localhost: ruch z internetu idzie przez tunel Cloudflare (localhost:40141),
# a watchdog, migawki stref i kopie łączą się z 127.0.0.1.
ExecStart=
ExecStart=/opt/straznik/backend/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 40141 --backlog 4096 --timeout-keep-alive 30 --ws-ping-interval 25 --ws-ping-timeout 25 --no-access-log
Environment=PYTHONDONTWRITEBYTECODE=1
UMask=0027

# Zapis wyłącznie do data/; reszta systemu tylko do odczytu.
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=/opt/straznik/backend/data
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
SystemCallArchitectures=native
