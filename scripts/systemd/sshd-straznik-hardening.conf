# Strażnik (ruth121) — SSH wyłącznie kluczem, audyt 26.09.2026.
# Na VPS: /etc/ssh/sshd_config.d/10-straznik-hardening.conf
#
# `PasswordAuthentication no` nie wystarczało: przy `UsePAM yes` i
# `KbdInteractiveAuthentication yes` PAM i tak pytał o hasło roota — tę samą
# dziurę naprawiliśmy 17.09 na robert154, a na nowy serwer poprawka nie przeszła.
# Numer 10 — sshd bierze PIERWSZĄ znalezioną wartość, a pliki z sshd_config.d
# czyta w kolejności nazw, przed resztą sshd_config.
#
# Konsekwencja: WebSSH w panelu Mikrusa (loguje hasłem) przestaje działać.
# Droga awaryjna: panel Mikrusa → „Klucz SSH” dopisuje klucz do authorized_keys.
# Powrót: usunąć ten plik — nowe połączenia od razu biorą starą konfigurację.
KbdInteractiveAuthentication no
PasswordAuthentication no
PermitRootLogin prohibit-password
MaxAuthTries 3
X11Forwarding no
AllowAgentForwarding no
