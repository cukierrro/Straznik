# Strażnik — needrestart nie restartuje usług Strażnika sam (audyt 26.09.2026).
# Na VPS: /etc/needrestart/conf.d/straznik.conf
#
# Po nocnej instalacji poprawek bezpieczeństwa needrestart restartuje usługi
# korzystające ze starych bibliotek. Usługi systemowe — tak, automatycznie.
# Strażnika — nigdy: restart w trakcie zdarzenia to kilka sekund bez alarmów,
# a wdrożenia i tak restartują go regularnie.
$nrconf{restart} = 'a';
$nrconf{override_rc}{qr(^straznik)} = 0;
