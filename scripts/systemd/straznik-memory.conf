# Strażnik — pamięć usługi (17.09.2026).
# Na VPS: /etc/systemd/system/straznik.service.d/memory.conf
# Nadpisuje MemoryHigh/MemoryMax z unitu (było 2400M/2560M). Przy syrenach 17.09
# proces z 6000 WebSocketów miał ~780 MB; 3 GB zostawia zapas na 10 000 połączeń.
# Bezpiecznik w app/load_guard.py: poziom 1 od 2600 MB procesu albo 80% RAM VPS,
# poziom 2 od 2860 MB albo 90% — oba przed MemoryHigh, więc jądro nie dławi procesu.
# Pozostałe projekty na VPS zajmują ~1,7 GB, tunel Cloudflare do ~1 GB w szczycie.
[Service]
MemoryHigh=2900M
MemoryMax=3072M
