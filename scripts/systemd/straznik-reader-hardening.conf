# Strażnik — utwardzenie procesu publicznego (reader), audyt 26.09.2026.
# Na VPS: /etc/systemd/system/straznik-reader.service.d/hardening.conf
# Powrót: usunąć ten plik, `systemctl daemon-reload`, `systemctl restart straznik-reader`.
#
# Reader obsługuje CAŁY ruch z internetu, a działa jako ten sam użytkownik co
# writer. Bez tego pliku mógłby przeczytać klucz FCM i VAPID — czyli luka w
# najbardziej wystawionym procesie dawałaby fałszywy alarm na cały kraj.
# Reader nie inicjuje powiadomień (main.py: wraca przed init_vapid/init_fcm),
# a /api/push/ tunel kieruje do writera, więc tych plików nie potrzebuje wcale.
[Service]
InaccessiblePaths=-/opt/straznik/backend/data/fcm-service-account.json -/opt/straznik/backend/data/vapid.json

Environment=PYTHONDONTWRITEBYTECODE=1
UMask=0027
NoNewPrivileges=yes
ProtectSystem=strict
# db.init() otwiera bazę w trybie WAL także u readera, a WAL wymaga zapisu
# plików -wal/-shm. Bez tego reader nie wstanie.
ReadWritePaths=/opt/straznik/backend/data
ProtectHome=yes
PrivateTmp=yes
# /dev/shm (przez które writer podaje readerowi gotowe bajty) systemd współdzieli
# także przy prywatnym /dev — writer ma to ustawione od 14.09 i działa.
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
SystemCallArchitectures=native
