<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Strażnik — sprawdzona biblioteka modeli</title>
<style>body{margin:0;padding:24px;background:#0b0f1a;color:#dbe4f5;font:15px/1.5 system-ui}main{max-width:1250px;margin:auto}h1{font-size:26px}input,select,button{padding:12px;border:1px solid #687c9f;border-radius:8px;background:#162136;color:#fff;font:inherit}#cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:24px}article{border:1px solid #344461;background:#131b2c;border-radius:12px;overflow:hidden}img{width:100%;height:215px;object-fit:contain;background:#202637;display:block}.info{padding:16px}h2{font-size:19px;margin:4px 0}small{display:block;color:#bbc8de;margin-top:8px;font-size:12px}a{color:#a3caff}#status{color:#ffd381}.tag{font-size:12px;color:#a7caff}@media(max-width:850px){#cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:530px){body{padding:14px}#cards{grid-template-columns:1fr}img{height:auto;max-height:280px}}</style></head><body><main><button id="lang">English</button><h1 id="heading"></h1><p id="intro"></p><label id="search-label" for="search"></label> <input id="search" type="search" placeholder="PZ3T, H60, Boeing…"><p id="status"></p><div id="cards"></div></main>
<script src="aircraft-photo-catalog.js"></script><script src="aircraft-photos.js"></script><script>
'use strict';let lang='pl';const cards=document.getElementById('cards');const words={pl:{heading:'Sprawdzona biblioteka fotografii modeli',intro:'60 fotografii dla 61 sprawdzonych kodów. To katalog doboru, nie podgląd maszyn aktualnie na mapie. 21 kodów ma bezpośredni dobór, 39 wymaga dodatkowego potwierdzenia modelu. SB39 pozostaje bez zdjęcia.',search:'Szukaj modelu',automatic:'Przykład modelu na podstawie kodu',conditional:'Wymagane potwierdzenie konkretnego modelu',source:'Źródło',crop:'Kadrowanie źródłowe; bez dodatkowego retuszu.',unchanged:'Miniatura źródłowa; bez retuszu.',shown:'Widoczne fotografie'},en:{heading:'Reviewed aircraft model photo library',intro:'60 photographs for 61 reviewed codes. This is a selection catalog, not live aircraft. 21 codes have a direct match; 39 require additional model confirmation. SB39 has no photo.',search:'Find a model',automatic:'Base-model example selected by code',conditional:'Specific model confirmation required',source:'Source',crop:'Source crop; no further retouching.',unchanged:'Source thumbnail; no retouching.',shown:'Visible photographs'}};
function el(tag,t){const n=document.createElement(tag);n.textContent=t;return n}
function link(label,url){const n=el('a',label);n.href=url;n.target='_blank';n.rel='noopener noreferrer';return n}
function render(){const w=words[lang];document.documentElement.lang=lang;document.getElementById('lang').textContent=lang==='pl'?'English':'Polski';document.getElementById('heading').textContent=w.heading;document.getElementById('intro').textContent=w.intro;document.getElementById('search-label').textContent=w.search;cards.replaceChildren();const q=document.getElementById('search').value.toLowerCase();let count=0;
for(const [code,p] of Object.entries(AircraftPhotoCatalog.photos)){if(!(code+' '+p.model).toLowerCase().includes(q))continue;count++;const a=el('article',''),img=el('img',''),info=el('div','');img.src=p.src;img.alt=p.model;img.loading='lazy';info.className='info';const tag=el('p',code+' · '+(p.mode==='code'?w.automatic:w.conditional));tag.className='tag';info.append(tag,el('h2',p.model),el('p',AircraftPhotos.caption(p,lang)),el('small',p.author));const credit=el('small','');credit.append(link(w.source,p.sourceUrl),document.createTextNode(' · '),link(p.license,p.licenseUrl));info.append(credit,el('small',p.sourceCrop?w.crop:w.unchanged));a.append(img,info);cards.append(a)}document.getElementById('status').textContent=w.shown+': '+count;}
document.getElementById('search').addEventListener('input',render);document.getElementById('lang').addEventListener('click',()=>{lang=lang==='pl'?'en':'pl';render()});render();
</script></body></html>
