<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'none'">
<title>Strażnik — lokalny podgląd zdjęć modeli</title>
<style>body{background:#0b0f1a;color:#dbe4f5;font:16px/1.55 system-ui;margin:0;padding:24px}main{max-width:1050px;margin:auto}h1{font-size:26px}button{padding:10px 18px;color:#dbe4f5;background:#202c44;border:1px solid #718eb7;border-radius:8px;cursor:pointer}#cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:24px 0}article{background:#131b2c;border:1px solid #35445c;border-radius:16px;overflow:hidden}img{display:block;width:100%;height:260px;object-fit:contain;background:#202637}.info{padding:18px}h2{font-size:20px;margin:0 0 8px}a{color:#a1c9ff}small{display:block;font-size:12px;color:#b6c6df;margin-top:10px}#notice{padding:16px;border-left:3px solid #ffb220;background:#211e19}@media(max-width:650px){body{padding:16px}#cards{grid-template-columns:1fr}img{height:auto;max-height:290px}h1{font-size:23px}}</style></head>
<body><main><button id="lang" aria-label="Change language">English</button><h1 id="title"></h1><p id="intro"></p><section id="cards" aria-live="polite"></section><p id="notice"></p></main>
<script src="model-photo-preview.js"></script><script>
'use strict';
let language='pl', catalog;
const text={pl:{title:'Dwa właściwe modele zamiast przypadkowych zdjęć',intro:'Podgląd lokalny — nie ekran działającej APK. Fotografie przykładowych egzemplarzy, nie śledzonych maszyn.',source:'Źródło',notice:'Z42 bez potwierdzonego wariantu → brak zdjęcia. Nie zastępujemy go automatycznie Z-42, Z-142 ani Z-242L.',scope:['Model PZL-130; dokładny wariant TC obserwowanej maszyny niepotwierdzony.','Model Z-242L; inny egzemplarz i wyposażenie, nie czeski 0543.'],changes:['Źródłowe kadrowanie FOX 52; miniatura Commons, bez dodatkowego retuszu.','Miniatura Commons, bez dodatkowego kadrowania i retuszu.']},en:{title:'Two matching models, not random registration photos',intro:'Local preview — not a screen of the running APK. Example aircraft, not the tracked airframes.',source:'Source',notice:'Z42 without a verified variant → no photo. No automatic substitution with a Z-42, Z-142 or Z-242L.',scope:['PZL-130 model; exact TC variant of the tracked aircraft is unconfirmed.','Z-242L model; different aircraft and equipment, not Czech 0543.'],changes:['Source crop by FOX 52; Commons thumbnail, no further retouching.','Commons thumbnail, no additional cropping or retouching.']}};
function element(tag,value){const e=document.createElement(tag);e.textContent=value;return e}
function link(label,url){const a=element('a',label);a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a}
function render(){const t=text[language];document.documentElement.lang=language;document.querySelector('#lang').textContent=language==='pl'?'English':'Polski';for(const k of ['title','intro','notice'])document.getElementById(k).textContent=t[k];const cards=document.querySelector('#cards');cards.replaceChildren();
  [{type:'PZ3T'},{type:'Z42',verifiedModelId:'z242l'}].forEach((a,i)=>{const p=AircraftPhotoPreview.selectPhoto(a,catalog,language);if(!p)return;const card=element('article',''),img=element('img',''),info=element('div','');info.className='info';img.src=p.src;img.alt=p.model;info.append(element('h2',p.model),element('p',p.caption),element('p',t.scope[i]),element('small',p.author));const credits=element('small','');credits.append(link(t.source,p.sourceUrl),document.createTextNode(' · '),link(p.license,p.licenseUrl));info.append(credits,element('small',t.changes[i]));card.append(img,info);cards.append(card)});
}
document.getElementById('lang').addEventListener('click',()=>{language=language==='pl'?'en':'pl';if(catalog)render()});
fetch('preview-catalog.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(c=>{catalog=c;render()}).catch(()=>{document.querySelector('#notice').textContent='Nie udało się wczytać lokalnego katalogu / Local catalog unavailable.'});
</script></body></html>
